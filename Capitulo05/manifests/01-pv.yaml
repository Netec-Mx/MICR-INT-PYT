apiVersion: v1
kind: PersistentVolume
metadata:
  name: products-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/products-service
    type: DirectoryOrCreate
