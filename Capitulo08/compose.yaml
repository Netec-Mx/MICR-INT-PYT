services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-lab
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  mongo:
    image: mongo:7.0.11
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog
      MONGO_INITDB_ROOT_PASSWORD: catalog-lab
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "catalog", "--password", "catalog-lab", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 4s
      retries: 15
    volumes: ["mongo_data:/data/db"]
volumes:
  postgres_data:
  mongo_data:
